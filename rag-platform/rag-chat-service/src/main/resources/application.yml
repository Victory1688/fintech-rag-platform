server:
  port: 8085
  shutdown: graceful
  tomcat:
    threads:
      # 生成链路是长耗时调用，线程数不能按常规设太小，但也不能无脑放大
      max: 200

spring:
  application:
    name: rag-chat-service
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:rag-chat-service.yaml
      - optional:nacos:rag-common.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:rag}
        group: RAG_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:rag}
        group: RAG_GROUP
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/rag_chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:rag}
    password: ${MYSQL_PASSWORD:rag123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

feign:
  client:
    config:
      default:
        connectTimeout: 500
        readTimeout: 10000
      # 检索超时必须严于生成，检索慢就直接降级，不要让用户干等
      rag-retrieval-service:
        connectTimeout: 500
        readTimeout: 3000
      rag-platform-service:
        connectTimeout: 300
        readTimeout: 500

rag:
  # ---------------------------------------------------------------------------
  # 问答链路参数
  # ---------------------------------------------------------------------------
  chat:
    model-refresh-ms: 300000
    guardrail-refresh-ms: 600000
  # ---------------------------------------------------------------------------
  # 服务端来源鉴权（两套鉴权唯一分流点是 X-Request-Source，仅网关注入）
  # ---------------------------------------------------------------------------
  server:
    auth:
      enabled: true
      trusted-gateway-cidrs:
        - 10.10.1.0/24
      gateway-signature-enabled: false
      gateway-sign-secret: ${RAG_GATEWAY_SIGN_SECRET:}
  # ---------------------------------------------------------------------------
  # 在线评估（t_llm_eval_score 的 ONLINE 来源）
  # 只启用「无需裁判模型即可计算」的指标：CITATION_COVERAGE / CONTEXT_PRECISION。
  # FAITHFULNESS、ANSWER_RELEVANCY、HALLUCINATION 需要 LLM-as-judge，
  # 接入前刻意不计算 —— 用规则凑出来的假分数比没有分数更危险。
  # ---------------------------------------------------------------------------
  eval:
    online-enabled: ${RAG_EVAL_ONLINE_ENABLED:true}
    sample-rate: ${RAG_EVAL_SAMPLE_RATE:0.05}
    max-concurrent: ${RAG_EVAL_MAX_CONCURRENT:2}
    manual-metrics:
      - CITATION_COVERAGE
      - CONTEXT_PRECISION
  # ---------------------------------------------------------------------------
  # 回放（按 traceId 一键还原一次回答）
  # 深链模板按环境填写；**未配置时回放视图返回 null，前端不展示入口** ——
  # 不给一个点了必然 404 的链接，是运维工具的基本体面。
  # 模板里严禁出现任何密钥：LangFuse 凭据只配在 OTel Collector，业务服务零持有。
  # ---------------------------------------------------------------------------
  replay:
    enabled: ${RAG_REPLAY_ENABLED:true}
    apm-url-template: ${RAG_REPLAY_APM_URL:}
    langfuse-url-template: ${RAG_REPLAY_LANGFUSE_URL:}
    retrieval-log-url-template: ${RAG_REPLAY_RETRIEVAL_URL:}
  # ---------------------------------------------------------------------------
  # 可观测（详见 docs/05-AI可观测与运维监控方案.md）
  # 生产把 content-level 保持 METRICS_ONLY：既不落问答原文，也不影响链路回放能力
  # ---------------------------------------------------------------------------
  observability:
    enabled: true
    content-level: ${RAG_OBS_CONTENT_LEVEL:METRICS_ONLY}
    # 防呆闸：即使 content-level 被误配成 FULL_CONTENT，也不会真的上报原文
    # 如需在开发环境开启原文上报，把本项置为 true（生产严禁）
    allow-plain-text-content: ${RAG_OBS_ALLOW_PLAIN_TEXT:false}
    max-content-chars: 2000
    record-retrieved-chunks: false
    subject-hash-salt: ${RAG_SUBJECT_HASH_SALT:}
    provider-name: openai

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    propagation:
      # 显式锁定 W3C（traceparent + tracestate），禁止退回 b3 / 自定义头
      type: w3c
    sampling:
      probability: ${RAG_OBS_SAMPLING:0.1}
  otlp:
    tracing:
      # 应用只认 OTel Collector（LangFuse 密钥只配在 Collector，业务服务不持有）
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      timeout: 3s

logging:
  level:
    com.fintech.rag: INFO
    dev.langchain4j: WARN
