server:
  port: 8081
  shutdown: graceful
  tomcat:
    threads:
      max: 400

spring:
  application:
    name: rag-platform-service
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:rag-platform-service.yaml
      - optional:nacos:rag-common.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:rag}
        group: RAG_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:rag}
        group: RAG_GROUP
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/rag_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:rag}
    password: ${MYSQL_PASSWORD:rag123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  cache:
    type: redis
    redis:
      time-to-live: 5m
      # 不缓存 null，避免「应用不存在」被缓存后新建凭证不可用
      cache-null-values: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rag:
  security:
    # AES-256 主密钥（Base64 32 字节）。生产必须由 KMS 或环境变量注入，禁止入库、禁止提交仓库
    aes-key: ${RAG_AES_KEY:}
    jwt:
      issuer: rag-platform
      secret: ${RAG_JWT_SECRET:}
      access-token-ttl: 2h
      refresh-token-ttl: 8h
    app-sign:
      timestamp-window: 5m
      nonce-ttl: 10m
  server:
    auth:
      # 本平台自己的服务必须显式开启；rag-api 作为对外 SDK 时默认不开启
      enabled: true
      # 仅允许网关访问：/auth/verify 是网关专用的令牌校验入口
      gateway-only-paths:
        - /api/platform/auth/verify
      # 完全放开：登录/刷新是唯一的外网匿名入口，需叠加验证码与频率限制
      public-paths:
        - /api/platform/auth/login
        - /api/platform/auth/refresh
        - /actuator/**
        - /doc.html
        - /v3/api-docs/**
      # 网关网段白名单：判定「带来源标识的请求是否真的来自网关」
      trusted-gateway-cidrs:
        - 10.10.1.0/24
      # 容器/K8s 环境 Pod IP 会漂移，推荐启用签名强校验替代 IP 白名单
      gateway-signature-enabled: false
      gateway-sign-secret: ${RAG_GATEWAY_SIGN_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    propagation:
      # 显式锁定 W3C（traceparent + tracestate）。
      # 一旦被改成 b3，OTel Collector 与 LangFuse 都无法解析 traceparent，
      # 「APM 链路」与「AI 观测」的 traceId 会整条对不上（详见 docs/05 §1.2 第 1 条）。
      type: w3c
    sampling:
      probability: ${RAG_OBS_SAMPLING:0.1}
  otlp:
    tracing:
      # 应用只认 OTel Collector，不认 LangFuse（LangFuse 密钥只配在 Collector）
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      timeout: 3s
logging:
  level:
    com.fintech.rag: INFO
